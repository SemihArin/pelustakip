<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pelus Takip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F7BDD6;
      --bg2:#f2afc9;
      --bar:rgba(255,255,255,.42);
      --bar-border:rgba(255,255,255,.55);
      --btn:#c4a0b5;
      --btn-active:#ffffff;
      --btn-active-fg:#8f6f83;
      --text:#111;
      --shadow:0 8px 32px rgba(180,80,120,.18);
      --safe-bottom:max(12px, env(safe-area-inset-bottom));
      --safe-top:max(0px, env(safe-area-inset-top));
      --danger:#c95a6a;
      --danger-dark:#b44b5a;
      --gold:#e3b84a;
      --blue:#7aa6ff;
      --card-shadow:0 4px 16px rgba(160,60,100,.14);
      --radius-card:16px;
    }

    *{ box-sizing:border-box; }
    html,body{
      padding:0;
      margin:0;
      background:var(--bg);
      min-height:100vh;
      width:100%;
    }
    body{
      overflow-x:hidden;
      color:var(--text);
      font-family:system-ui, sans-serif;
      background-image: radial-gradient(ellipse at 20% 0%, rgba(255,200,220,.6) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 100%, rgba(200,150,180,.4) 0%, transparent 55%);
    }
    button, textarea, input{ font:inherit; }
    svg{ display:block; }
    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    /* BUG FIX: #connet yazım hatası düzeltildi → #container */
    #container{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      width:100%;
      min-height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#4d2438;
      border-bottom-left-radius:20px;
      border-bottom-right-radius:20px;
      font-size:30px;
      font-weight:900;
      font-family:"Caveat", cursive;
      background:rgba(255,255,255,.35);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding-top:calc(var(--safe-top) + 2px);
      padding-bottom:6px;
      border-bottom: 1px solid rgba(255,255,255,.5);
      letter-spacing:0.5px;
      box-shadow:0 4px 18px rgba(200,100,140,.12);
    }

    .page-header{
      position:sticky;
      top:0;
      z-index:100;
      padding:16px 18px 10px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      background:rgba(247,189,214,.65);
    }

    .page-header h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      letter-spacing:-0.5px;
      color:#4d3140;
      line-height:1.1;
    }

    .pages{
      width:100%;
      flex:1;
      min-height:0;
      padding-bottom:calc(95px + var(--safe-bottom));
    }

    .page{ display:none; }
    .page.active{ display:block; }

    .gallery,
    .published-gallery{
      display:flex;
      flex-direction:column;
      gap:20px;
      padding:14px;
      width:100%;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .group-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:2px 4px;
      color:#6a3d52;
      font-weight:800;
      font-size:15px;
    }

    .group-count{
      font-weight:700;
      opacity:.65;
      font-size:12px;
      background:rgba(255,255,255,.55);
      padding:3px 9px;
      border-radius:999px;
    }

    .group-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap:10px;
      width:100%;
    }

    /* BUG FIX: kırmızı gölge rgba(255,0,0,.25) → düzgün ton */
    .card{
      width:100%;
      aspect-ratio:1/1;
      border-radius:var(--radius-card);
      overflow:hidden;
      box-shadow:var(--card-shadow);
      background:#fff;
      position:relative;
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .card:active{
      transform:scale(.97);
      box-shadow:0 2px 8px rgba(160,60,100,.1);
    }

    .gallery-card,
    .published-card{
      padding:0;
      border:none;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      display:block;
      text-align:inherit;
    }

    .cimg{ width:100%; height:100%; }
    img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .fav-badge{
      position:absolute;
      top:7px;
      right:7px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:rgba(255,255,255,.94);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 3px 10px rgba(0,0,0,.14);
      pointer-events:none;
    }
    .fav-badge svg{
      width:13px;
      height:13px;
      color:var(--gold);
    }

    .published-badge{
      position:absolute;
      top:7px;
      left:7px;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(100,148,255,.9);
      color:white;
      font-size:10px;
      font-weight:800;
      letter-spacing:0.3px;
      box-shadow:0 4px 12px rgba(0,0,0,.14);
      pointer-events:none;
    }

    .published-meta{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:22px 10px 9px;
      background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%);
      color:white;
      font-size:11px;
      text-shadow:0 1px 3px rgba(0,0,0,.45);
      pointer-events:none;
      border-radius:0 0 var(--radius-card) var(--radius-card);
    }

    .empty-state{
      text-align:center;
      padding:48px 20px;
      color:#7a4d62;
      opacity:.8;
      font-size:15px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    .empty-state::before{
      content:"🐾";
      font-size:40px;
      display:block;
      margin-bottom:4px;
    }

    @media (max-width:400px){
      .group-grid{
        grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
        gap:10px;
      }
      .gallery,
      .published-gallery{
        padding:10px;
      }
    }

    /* BUG FIX: camera-page display:none kaldırıldı — .page zaten gizliyor, çakışma önlendi */
    .camera-page{
      position:relative;
      width:100%;
      min-height:calc(100vh - 55px - 95px);
      overflow:hidden;
      background:black;
      touch-action:none;
    }

    #camera{
      width:100%;
      height:100%;
      min-height:inherit;
      object-fit:cover;
      display:block;
      transition:transform .18s ease;
    }

    #camera.front-camera{ transform:scaleX(-1); }

    .camera-badge{
      position:absolute;
      top:16px;
      left:16px;
      z-index:10000;
      padding:9px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      font-size:13px;
      font-weight:700;
      color:#2b1a24;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
      pointer-events:none;
    }

    .focus-ring{
      position:absolute;
      width:74px;
      height:74px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.95);
      box-shadow:0 0 0 2px rgba(0,0,0,.14) inset;
      transform:translate(-50%,-50%) scale(.85);
      opacity:0;
      pointer-events:none;
      z-index:10001;
    }
    .focus-ring.show{ animation:focusPop .55s ease; }
    @keyframes focusPop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); }
      20%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
      100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05); }
    }

    .camera-controls{
      position:absolute;
      left:12px;
      right:12px;
      bottom:155px;
      z-index:10000;
      display:none;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(12px);
      box-shadow:0 10px 22px rgba(0,0,0,.14);
    }
    .camera-controls.show{ display:flex; }
    .camera-controls label{
      font-size:13px;
      font-weight:700;
      color:#2b1a24;
      white-space:nowrap;
    }
    .camera-controls input[type="range"]{ width:100%; }
    .camera-controls .value{
      min-width:42px;
      text-align:right;
      font-size:12px;
      font-weight:700;
      color:#2b1a24;
    }

    #captureBtn{
      position:absolute;
      bottom:84px;
      left:50%;
      transform:translateX(-50%);
      width:58px;
      height:58px;
      border-radius:50%;
      border:4px solid white;
      background:white;
      cursor:pointer;
      z-index:10000;
      box-shadow:0 0 20px rgba(255,255,255,.4), 0 0 12px rgba(0,0,0,.2);
      -webkit-tap-highlight-color:transparent;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #captureBtn:active{ transform:translateX(-50%) scale(.96); }
    #captureBtn::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:2px solid rgba(0,0,0,.08);
    }
    .capture-icon{
      width:18px;
      height:18px;
      color:#222;
      opacity:.2;
      pointer-events:none;
    }

    .camera-tool-btn{
      position:absolute;
      top:18px;
      right:18px;
      width:52px;
      height:52px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.85);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10000;
      padding:0;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
    }
    .camera-tool-btn svg{ width:24px; height:24px; color:#2b1a24; }
    .camera-tool-btn:active{ transform:scale(.96); }

    .bottombar{
      position:fixed;
      left:14px;
      right:14px;
      bottom:var(--safe-bottom);
      height:66px;
      background:rgba(255,255,255,.48);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.65);
      border-radius:26px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      z-index:9999;
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
      padding:8px;
    }
    .nav-btn{
      flex:1;
      max-width:180px;
      height:50px;
      border:none;
      border-radius:20px;
      background:rgba(185,150,170,.35);
      color:#7a4d62;
      transition:transform .15s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      position:relative;
    }
    .nav-btn svg{ width:22px; height:22px; color:currentColor; }
    .nav-btn:active{ transform:scale(.95); }
    .nav-btn.active{
      background:var(--btn-active);
      color:var(--btn-active-fg);
      box-shadow:0 4px 14px rgba(140,80,110,.2);
    }

    .unread-badge{
      position:absolute;
      top:6px;
      right:8px;
      min-width:17px;
      height:17px;
      border-radius:999px;
      background:var(--danger);
      color:#fff;
      font-size:10px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 4px;
      pointer-events:none;
      line-height:1;
      box-shadow:0 2px 6px rgba(0,0,0,.25);
      animation:badgePop .2s ease;
    }
    @keyframes badgePop{
      0%{ transform:scale(0); }
      70%{ transform:scale(1.2); }
      100%{ transform:scale(1); }
    }


    @media (max-width:380px){
      .bottombar{ left:10px; right:10px; height:62px; gap:8px; }
      .nav-btn{ height:46px; }
      #captureBtn{ width:54px; height:54px; bottom:76px; }
      .camera-tool-btn{ width:46px; height:46px; top:14px; right:14px; }
      .camera-tool-btn svg{ width:22px; height:22px; }
      .camera-badge{ top:12px; left:12px; font-size:12px; padding:8px 10px; }
      .camera-controls{ bottom:145px; left:10px; right:10px; padding:8px 10px; }
    }

    @media (min-width:700px){
      .group-grid{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
      .bottombar{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(560px, calc(100% - 24px));
      }
      #captureBtn{ width:66px; height:66px; }
      .camera-controls{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(560px, calc(100% - 24px));
      }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(20,5,15,.55);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:0;
      z-index:10010;
    }
    .modal.show{ display:flex; animation:modalFadeIn .22s ease; }
    @keyframes modalFadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }
    .modal-card{
      width:min(100%, 520px);
      max-height:min(93vh, 800px);
      overflow:auto;
      background:linear-gradient(160deg, rgba(252,220,235,.99) 0%, rgba(247,185,210,.98) 100%);
      border-radius:28px 28px 0 0;
      box-shadow:0 -8px 40px rgba(140,60,100,.22);
      padding:18px 16px 24px;
      animation:sheetUp .28s cubic-bezier(.34,1.1,.64,1);
    }
    @keyframes sheetUp{
      from{ transform:translateY(40px); opacity:.5; }
      to{ transform:translateY(0); opacity:1; }
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }
    .modal-title{
      font-size:clamp(18px, 4vw, 22px);
      font-weight:800;
      color:#2b1a24;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .modal-sub{ font-size:11px; font-weight:600; opacity:.65; background:rgba(0,0,0,.08); padding:3px 8px; border-radius:999px; }
    .icon-btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.7);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
      transition:transform .15s ease;
    }
    .icon-btn:active{ transform:scale(.93); }
    .icon-btn svg{ width:20px; height:20px; color:#2b1a24; }
    .modal-preview{
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border-radius:20px;
      background:#fff;
      display:block;
      box-shadow:0 4px 16px rgba(0,0,0,.12);
    }
    .field{ margin-top:12px; }
    .field label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
      font-size:14px;
    }
    .field textarea{
      width:100%;
      min-height:90px;
      resize:vertical;
      border:none;
      outline:none;
      border-radius:14px;
      padding:12px;
      font-size:16px;
      background:rgba(255,255,255,.88);
      box-shadow:inset 0 2px 6px rgba(0,0,0,.06);
      transition:box-shadow .2s ease;
    }
    .field textarea:focus{
      box-shadow:inset 0 2px 6px rgba(0,0,0,.06), 0 0 0 2px rgba(180,100,140,.3);
    }
    .switch-row{
      display:flex;
      gap:8px;
      align-items:center;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .switch-chip{
      padding:10px 14px;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:rgba(255,255,255,.7);
      color:#4d2438;
      font-weight:700;
      font-size:14px;
      display:flex;
      align-items:center;
      gap:7px;
      transition:background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .switch-chip.active{
      background:#c0648a;
      color:white;
      box-shadow:0 4px 12px rgba(192,100,138,.3);
    }
    .location-box{
      margin-top:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,.78);
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, opacity .15s ease, background .15s ease;
      box-shadow:0 2px 10px rgba(0,0,0,.07);
    }
    .location-box:active{ transform:scale(.99); }
    .location-box.waiting{ opacity:.7; pointer-events:none; }
    .location-box.disabled{ opacity:.5; cursor:not-allowed; }
    .loc-title{
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
    }
    #locationValue{
      font-size:13px;
      opacity:.85;
      color:#3f2433;
      word-break:break-word;
    }
    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:14px;
    }
    .action-full{ grid-column:1 / -1; }
    .action-btn{
      height:50px;
      border:none;
      border-radius:18px;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 14px;
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .action-btn:active{ transform:scale(.97); opacity:.9; }
    .action-btn svg{ width:18px; height:18px; color:currentColor; }
    .action-secondary{ background:rgba(255,255,255,.72); color:#2b1a24; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .action-primary{ background:#c0648a; color:white; box-shadow:0 4px 14px rgba(192,100,138,.3); }
    .action-danger{ background:var(--danger); color:white; box-shadow:0 4px 14px rgba(201,90,106,.3); }
    .action-danger:active{ background:var(--danger-dark); }
    .hint{
      margin-top:8px;
      font-size:12px;
      color:#5c3a4d;
      opacity:.75;
      line-height:1.45;
    }

    #loader{
      position:fixed;
      inset:0;
      background:var(--bg);
      background-image: radial-gradient(ellipse at 30% 20%, rgba(255,200,220,.7) 0%, transparent 55%),
                        radial-gradient(ellipse at 70% 80%, rgba(200,150,180,.5) 0%, transparent 50%);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999999;
      transition:opacity .4s ease, visibility .4s ease;
    }
    #loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
    .loader-content{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    /* BUG FIX: loader rengi beyaz idi, arka planla karışıyordu — koyu pembeye çevrildi */
    .loader-logo{
      width:88px;
      height:88px;
      animation:spin 1.1s linear infinite;
      display:block;
      color:#c0648a;
    }
    .loader-logo .track{ stroke:rgba(180,80,120,.2); }
    .loader-logo .ring{ stroke-dasharray:220; stroke-dashoffset:120; }
    .loader-text{
      font-family:"Caveat",cursive;
      font-weight:800;
      font-size:30px;
      color:#4d2438;
    }
    .loader-sub{ font-size:13px; color:#7a4d62; opacity:.85; }
    @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

    #toast{
      position:fixed;
      left:50%;
      bottom:100px;
      /* BUG FIX: başlangıç transform eklendi — slideUp animasyonu için */
      transform:translateX(-50%) translateY(12px);
      background:rgba(40,20,32,.94);
      color:white;
      padding:12px 18px;
      border-radius:16px;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
      z-index:100020;
      max-width:min(92vw, 420px);
      text-align:center;
      box-shadow:0 12px 32px rgba(0,0,0,.25);
      font-size:14px;
      line-height:1.35;
      border:1px solid rgba(255,255,255,.1);
    }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    @media (min-width:700px){ #toast{ bottom:110px; } }

    /* ══════════════════════════════════════════
       ONAY MODALİ — TAM YENİDEN TASARIM
       ══════════════════════════════════════════ */

    /* Backdrop — en üst z-index */
    #confirmModal{
      z-index:200000 !important;
      background:transparent;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* Backdrop animasyonu */
    #confirmModal::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(20,5,15,.62);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      opacity:0;
      transition:opacity .3s ease;
      z-index:-1;
    }
    #confirmModal.show::before{ opacity:1; }

    /* Kart */
    .confirm-card{
      width:min(100%, 340px);
      background:#fff;
      border-radius:28px;
      overflow:hidden;
      box-shadow:
        0 32px 64px rgba(0,0,0,.22),
        0 8px 20px rgba(200,80,120,.18),
        inset 0 1px 0 rgba(255,255,255,.9);
      transform:scale(.82) translateY(24px);
      opacity:0;
      transition:
        transform .38s cubic-bezier(.34,1.56,.64,1),
        opacity .28s ease;
      will-change:transform, opacity;
    }
    #confirmModal.show .confirm-card{
      transform:scale(1) translateY(0);
      opacity:1;
    }

    /* Kapanış animasyonu için */
    #confirmModal.closing .confirm-card{
      transform:scale(.88) translateY(16px);
      opacity:0;
      transition:
        transform .22s cubic-bezier(.55,.05,.67,.19),
        opacity .18s ease;
    }
    #confirmModal.closing::before{ opacity:0; }

    /* İkon alanı */
    .confirm-icon-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 24px 16px;
      position:relative;
    }
    .confirm-icon-bg{
      width:72px;
      height:72px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    .confirm-icon-bg.danger{
      background:linear-gradient(145deg, #fde8ec, #fac8d0);
      box-shadow:0 8px 24px rgba(201,90,106,.25);
    }
    .confirm-icon-bg.warning{
      background:linear-gradient(145deg, #fff8e6, #ffe9a0);
      box-shadow:0 8px 24px rgba(220,160,20,.22);
    }
    .confirm-icon-bg.info{
      background:linear-gradient(145deg, #e8f0ff, #c8d8ff);
      box-shadow:0 8px 24px rgba(100,140,255,.22);
    }
    .confirm-icon-bg.success{
      background:linear-gradient(145deg, #e6faf0, #b8f0d0);
      box-shadow:0 8px 24px rgba(40,180,100,.2);
    }
    /* İkon giriş animasyonu */
    #confirmModal.show .confirm-icon-bg{
      animation:iconBounce .55s cubic-bezier(.34,1.56,.64,1) .1s both;
    }
    @keyframes iconBounce{
      0%{ transform:scale(0) rotate(-12deg); opacity:0; }
      60%{ transform:scale(1.18) rotate(4deg); opacity:1; }
      100%{ transform:scale(1) rotate(0deg); }
    }
    .confirm-icon-bg svg{
      width:34px;
      height:34px;
    }

    /* Titreşim halkası */
    .confirm-icon-bg::before,
    .confirm-icon-bg::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      pointer-events:none;
    }
    #confirmModal.show .confirm-icon-bg.danger::before{
      border:2px solid rgba(201,90,106,.3);
      animation:ringPulse 1.6s ease-out .35s infinite;
    }
    #confirmModal.show .confirm-icon-bg.danger::after{
      border:2px solid rgba(201,90,106,.15);
      animation:ringPulse 1.6s ease-out .6s infinite;
    }
    #confirmModal.show .confirm-icon-bg.warning::before{
      border:2px solid rgba(220,160,20,.3);
      animation:ringPulse 1.6s ease-out .35s infinite;
    }
    #confirmModal.show .confirm-icon-bg.warning::after{
      border:2px solid rgba(220,160,20,.15);
      animation:ringPulse 1.6s ease-out .6s infinite;
    }
    #confirmModal.show .confirm-icon-bg.info::before{
      border:2px solid rgba(100,140,255,.3);
      animation:ringPulse 1.6s ease-out .35s infinite;
    }
    #confirmModal.show .confirm-icon-bg.info::after{
      border:2px solid rgba(100,140,255,.15);
      animation:ringPulse 1.6s ease-out .6s infinite;
    }
    @keyframes ringPulse{
      0%{ transform:scale(1); opacity:1; }
      100%{ transform:scale(1.9); opacity:0; }
    }

    /* İçerik */
    .confirm-body{
      padding:0 24px 8px;
      text-align:center;
    }
    .confirm-title{
      font-size:19px;
      font-weight:800;
      color:#1a0f14;
      margin:0 0 8px;
      line-height:1.25;
      opacity:0;
      transform:translateY(8px);
      transition:opacity .3s ease .15s, transform .3s ease .15s;
    }
    #confirmModal.show .confirm-title{
      opacity:1;
      transform:translateY(0);
    }
    .confirm-text{
      color:#6b3d52;
      line-height:1.55;
      font-size:14px;
      margin:0;
      opacity:0;
      transform:translateY(6px);
      transition:opacity .3s ease .22s, transform .3s ease .22s;
    }
    #confirmModal.show .confirm-text{
      opacity:1;
      transform:translateY(0);
    }

    /* Buton alanı */
    .confirm-actions{
      display:flex;
      flex-direction:column;
      gap:0;
      margin-top:20px;
      border-top:1px solid rgba(0,0,0,.06);
      opacity:0;
      transition:opacity .3s ease .28s;
    }
    #confirmModal.show .confirm-actions{ opacity:1; }

    .confirm-actions .action-btn{
      border-radius:0;
      height:54px;
      font-size:16px;
      box-shadow:none;
      border:none;
      width:100%;
    }
    .confirm-actions .action-btn:first-child{
      border-bottom:1px solid rgba(0,0,0,.06);
      color:#888;
      background:#fff;
      font-weight:600;
    }
    .confirm-actions .action-btn:first-child:active{
      background:#f5f5f5;
    }
    .confirm-actions .action-btn:last-child{
      background:#fff;
      color:var(--danger);
      font-weight:800;
      font-size:17px;
      border-radius:0 0 28px 28px;
    }
    .confirm-actions .action-btn:last-child:active{
      background:#fff5f6;
      transform:none;
    }
    /* Sil butonuna micro-shake animasyonu gelişimi */
    #confirmModal.show .confirm-actions .action-btn:last-child{
      animation:dangerPulse 2.2s ease 0.8s infinite;
    }
    @keyframes dangerPulse{
      0%, 88%, 100%{ color:var(--danger); }
      92%{ color:#ff3355; }
      96%{ color:var(--danger); }
    }

    /* Ok butonu tip renkleri */
    #confirmModal .confirm-actions .action-btn:last-child.ok-danger{ color:var(--danger); }
    #confirmModal .confirm-actions .action-btn:last-child.ok-warning{ color:#c8860a; animation:none; }
    #confirmModal .confirm-actions .action-btn:last-child.ok-info{ color:#4a72d4; animation:none; }
    #confirmModal .confirm-actions .action-btn:last-child.ok-success{ color:#1a9c5c; animation:none; }

    .section-switch{

    function openDBWithTimeout(timeoutMs = 2500) {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB desteklenmiyor"));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        let settled = false;

        const settleResolve = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };
        const settleReject = (error) => {
          if (settled) return;
          settled = true;
          reject(error);
        };
        const timer = setTimeout(() => settleReject(new Error("IndexedDB zaman aşımı")), timeoutMs);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            const store = database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
            store.createIndex("created", "created", { unique: false });
          }
        };

        request.onsuccess = (event) => {
          clearTimeout(timer);
          db = event.target.result;
          settleResolve(db);
        };
        request.onerror = () => { clearTimeout(timer); settleReject(request.error || new Error("IndexedDB açılamadı")); };
        request.onblocked = () => { clearTimeout(timer); settleReject(new Error("IndexedDB engellendi")); };
      });
    }

    function getLocalPhotos() {

    function savePhoto(record) {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const request = record.id ? store.put(record) : store.add(record);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      return new Promise((resolve) => {
        const photos = getLocalPhotos();
        if (record.id !== null && record.id !== undefined) {
          const index = photos.findIndex(p => p.id === record.id);
          if (index !== -1) photos[index] = record;
          else photos.push(record);
        } else {
          record.id = Date.now() + Math.random();
          photos.push(record);
        }
        setLocalPhotos(photos);
        resolve(record.id);
      });
    }

    function deletePhotoById(id) {

        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");

          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }
      return new Promise((resolve) => {
        const photos = getLocalPhotos().filter(p => p.id !== id);
        setLocalPhotos(photos);
        resolve();
      });
    }

    function getAllPhotos() {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }
      return Promise.resolve(getLocalPhotos());
    }

    function formatDateKey(ts){
      const d = new Date(ts);
      return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
    }

    function formatGroupLabel(key){
      const [y,m,d] = key.split("-").map(Number);
      const date = new Date(y, m-1, d);
      const today = new Date();
      const todayKey = formatDateKey(today.getTime());
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const yesterdayKey = formatDateKey(yesterday.getTime());
      if (key === todayKey) return "Bugün";
      if (key === yesterdayKey) return "Dün";
      return date.toLocaleDateString("tr-TR", { day:"2-digit", month:"long", year:"numeric" });
    }

    function groupPhotosByDate(photos){
      const groups = new Map();
      photos.forEach(photo => {
        const key = formatDateKey(photo.created || Date.now());
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(photo);
      });
      return [...groups.entries()].sort((a,b) => b[0].localeCompare(a[0])).map(([key, items]) => ({ key, label: formatGroupLabel(key), items }));
    }

    async function stopCameraFully() {
      if (cameraTrack) {
        try { cameraTrack.onended = null; } catch {}
        try { cameraTrack.stop(); } catch {}
        cameraTrack = null;
      }
      if (!stream) {
        video.srcObject = null;
        return;
      }
      const tracks = stream.getTracks();
      const endedPromises = tracks.map(track => new Promise(resolve => {
        if (track.readyState === "ended") { resolve(); return; }
        track.onended = () => resolve();
      }));
      tracks.forEach(track => { try { track.stop(); } catch {} });
      try { video.pause(); } catch {}
      video.srcObject = null;
      await Promise.race([Promise.allSettled(endedPromises), sleep(900)]);
      stream = null;
    }

    function resetCameraControls(){

    async function applyZoom(value){
      if (!cameraTrack) return;
      const zoom = Math.max(currentZoomMin, Math.min(currentZoomMax, Number(value || 1)));
      currentZoom = zoom;
      zoomValue.textContent = `${zoom.toFixed(1)}x`;
      zoomRange.value = String(zoom);
      try {
        await cameraTrack.applyConstraints({ advanced:[{ zoom }] });
      } catch {}
    }

    function setupCameraCapabilities(){
      resetCameraControls();
      if (!cameraTrack || !cameraTrack.getCapabilities) return;
      const caps = cameraTrack.getCapabilities();
      // BUG FIX: caps.zoom bir obje { min, max, step } döndürür, "number" değil.
      if (caps && caps.zoom && typeof caps.zoom === "object") {
        canZoom = true;
        currentZoomMin = caps.zoom.min ?? 1;
        currentZoomMax = caps.zoom.max ?? 1;
        currentZoomStep = caps.zoom.step ?? 0.1;
        currentZoom = Math.max(currentZoomMin, Math.min(currentZoomMax, currentZoom || 1));
        zoomRange.min = String(currentZoomMin);
        zoomRange.max = String(currentZoomMax);
        zoomRange.step = String(currentZoomStep);
        zoomRange.value = String(currentZoom);
        zoomValue.textContent = `${currentZoom.toFixed(1)}x`;
        cameraControls.classList.add("show");
      }
      try {
        if (caps && caps.focusMode && Array.isArray(caps.focusMode)) {
          cameraTrack.applyConstraints({ advanced:[{ focusMode:"continuous" }] }).catch(()=>{});
        }
      } catch {}
    }

    async function openCamera(mode) {
      if (cameraBusy) return false;
      cameraBusy = true;
      try {
        await stopCameraFully();
        await sleep(700);
        // En yüksek kalite önce denenir, her adımda çözünürlük düşürülür
        const attempts = [
          { video: { facingMode: { exact: mode }, width: { ideal: 4096 }, height: { ideal: 2160 } }, audio: false },
          { video: { facingMode: { ideal: mode }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false },
          { video: { facingMode: { ideal: mode }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
          { video: { facingMode: mode }, audio: false },
          { video: true, audio: false }
        ];
        for (const constraints of attempts) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            try { await video.play(); } catch {}
            cameraTrack = stream.getVideoTracks()[0] || null;
            currentFacingMode = mode;
            setCameraBadge(mode);
            setupCameraCapabilities();
            return true;
          } catch {}
        }
        showToast("Kamera açılamadı");
        return false;
      } finally {
        cameraBusy = false;
      }
    }

    function getPositionOnce(options) {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator)) {
          reject({ code: 0, message: "Tarayıcı konumu desteklemiyor" });
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    async function getCurrentLocation() {
      try {
        if (navigator.permissions) {
          try {
            const permission = await navigator.permissions.query({ name: "geolocation" });
            if (permission.state === "denied") return { label: "Konum izni kapalı", mapsUrl: "" };
          } catch {}
        }
        const first = await getPositionOnce({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
        const lat = first.coords.latitude.toFixed(6);
        const lon = first.coords.longitude.toFixed(6);
        const acc = Math.round(first.coords.accuracy);
        return { label: `Konum: ${lat}, ${lon} (±${acc}m)`, mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}` };
      } catch (err1) {
        try {
          const second = await getPositionOnce({ enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
          const lat = second.coords.latitude.toFixed(6);
          const lon = second.coords.longitude.toFixed(6);
          const acc = Math.round(second.coords.accuracy);
          return { label: `Konum: ${lat}, ${lon} (±${acc}m)`, mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}` };
        } catch (err2) {
          return { label: geoErrorText(err2 || err1), mapsUrl: "" };
        }
      }
    }

  /**
   * Fotoğrafı Firestore'a kaydetmeden önce sıkıştır.
   * Firestore doküman limiti 1MB — base64 overhead'i de dahil güvenli kalmak için
   * max 900px'e indir ve quality'yi düşür.
   */
  function compressImageForFirestore(dataUrl) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width >= height) { height = Math.round((height * MAX) / width); width = MAX; }
          else { width = Math.round((width * MAX) / height); height = MAX; }
        }
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        // ~0.6 quality: tipik kamera karesini 200-400KB base64'e indirir
        resolve(c.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = () => resolve(dataUrl); // sıkıştırma başarısız olursa orijinali kullan
      img.src = dataUrl;
    });
  }

   async function publishCurrentPhoto() {
  if (!currentPhotoImage) {
    showToast("Fotoğraf yok");
    return;
  }

  // Yayın onayı
  const isUpdate = !!currentPhotoPublishedId;
  const approved = await openConfirm({
    type: "publish",
    title: isUpdate ? "Yayın güncellensin mi?" : "Herkese yayınlansın mı?",

    cancelLabel: "İptal"
  });
  if (!approved) return;

  try {
    showToast("Yayınlanıyor...");

    // Firestore 1MB limit — önce sıkıştır
    const compressed = await compressImageForFirestore(currentPhotoImage);

    // Sıkıştırılmış base64 boyutunu kontrol et (~750KB üstü reddedilir)
    const byteSize = Math.round((compressed.length * 3) / 4);
    if (byteSize > 900_000) {
      showToast("Fotoğraf çok büyük, kaydedilemedi");
      return;
    }

    const payload = {
      image: compressed,                          // base64 string, URL değil
      note: noteInput.value.trim(),
      locationLabel: currentLocationLabel || "",
      mapsUrl: currentLocationMapsUrl || "",
      favorite: !!currentPhotoFavorite,
      originalLocalId: currentPhotoId || null,
      source: "pelus-takip",
      created: serverTimestamp(),

    };

    if (currentPhotoPublishedId) {
      await updateDoc(doc(dbFirebase, firebaseCollectionName, currentPhotoPublishedId), payload);
      addMyPublishedId(currentPhotoPublishedId);  // güncelleme de hâlâ benim yayınim
      showToast("Yayın güncellendi");
    } else {
      const docRef = await addDoc(collection(dbFirebase, firebaseCollectionName), payload);
      currentPhotoPublishedId = docRef.id;
      addMyPublishedId(docRef.id);   // Bu cihazdan yayınlandı olarak işaretle
      showToast("Yayınlandı");
    }

    await loadPhotos();
    await loadPublishedPhotos();
  } catch (err) {
    console.error("publishCurrentPhoto error:", err);
    showToast(`Yayınlama başarısız${err?.code ? `: ${err.code}` : ""}`);
  }
}

      focusRing.style.left = `${x}%`;

      focusRing.classList.remove("show");

    });

    modalClose.addEventListener("click", closePhotoModal);
    modalCancel.addEventListener("click", closePhotoModal);
    modalSave.addEventListener("click", saveCurrentModalPhoto);
    modalShare.addEventListener("click", shareCurrentPhoto);
    publishBtn.addEventListener("click", publishCurrentPhoto);
    modalDelete.addEventListener("click", deleteCurrentPhoto);
    photoModal.addEventListener("click", (event) => {
      if (event.target === photoModal) closePhotoModal();
    });

    confirmCancel.addEventListener("click", () => {
      confirmResolver?.(false);
      confirmResolver = null;
      closeModal(confirmModal);
    });
    confirmOk.addEventListener("click", () => {
      confirmResolver?.(true);
      confirmResolver = null;
      closeModal(confirmModal);
    });
    confirmModal.addEventListener("click", (event) => {
      if (event.target === confirmModal) {
        confirmResolver?.(false);
        confirmResolver = null;
        closeModal(confirmModal);
      }
    });

    // BUG FIX: beforeunload async desteklemez — await çalışmaz.
    // Senkron olarak track ve listener temizlenir.
    window.addEventListener("beforeunload", () => {
      if (cameraTrack) { try { cameraTrack.stop(); } catch {} }
      if (stream) { try { stream.getTracks().forEach(t => t.stop()); } catch {} }
      if (publishedUnsubscribe) {
        try { publishedUnsubscribe(); } catch {}
      }
    });

    // BUG FIX: type="module" scriptler defer'lı çalışır — DOMContentLoaded zaten tetiklenmiş olur.
    // Bu yüzden IIFE kullanıyoruz; DOM zaten hazır olduğu garantiyle direkt çalıştırıyoruz.
    (async () => {
      try {
        await initStorage();
        await loadPhotos();
        await loadPublishedPhotos();
        setActiveNav("local");
        setCameraBadge("environment");
      } catch (err) {
        console.error(err);
        galleryPage.innerHTML = '<div class="empty-state">Yükleme başarısız oldu</div>';
      } finally {
        hideLoader();
      }
    })();
  </script>
</body>
</html>
