<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Peluş Takip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F7BDD6;
      --bar:rgba(255,255,255,.38);
      --bar-border:rgba(255,255,255,.45);
      --btn:#B299AD;
      --btn-active:#ffffff;
      --btn-active-fg:#8f6f83;
      --text:#111;
      --shadow:0 8px 25px rgba(0,0,0,.15);
      --safe-bottom:max(12px, env(safe-area-inset-bottom));
      --safe-top:max(0px, env(safe-area-inset-top));
      --danger:#c95a6a;
      --danger-dark:#b44b5a;
    }

    *{ box-sizing:border-box; }

    html,body{
      padding:0;
      margin:0;
      background:var(--bg);
      min-height:100vh;
      width:100%;
    }

    body{
      overflow-x:hidden;
      color:var(--text);
      font-family:system-ui, sans-serif;
    }

    button, textarea{
      font:inherit;
    }

    svg{
      display:block;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    #connet{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      width:100%;
      min-height:55px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:black;
      border-bottom-left-radius:17px;
      border-bottom-right-radius:17px;
      font-size:clamp(24px, 6vw, 34px);
      font-weight:900;
      font-family:"Caveat",cursive;
      padding-top:var(--safe-top);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
    }

    .pages{
      width:100%;
      flex:1;
      min-height:0;
      padding-bottom:calc(95px + var(--safe-bottom));
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap:12px;
      padding:12px;
      width:100%;
    }

    .card{
      width:100%;
      aspect-ratio:1/1;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 5px 8px rgba(255,0,0,.25);
      background:#fff;
    }

    .gallery-card{
      padding:0;
      border:none;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      display:block;
      text-align:inherit;
    }

    .cimg{
      width:100%;
      height:100%;
    }

    img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .empty-state{
      grid-column:1 / -1;
      text-align:center;
      padding:24px 12px;
      color:#6a3d52;
      opacity:.8;
    }

    @media (max-width:400px){
      .gallery{
        grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
        gap:10px;
        padding:10px;
      }
    }

    .camera-page{
      display:none;
      position:relative;
      width:100%;
      min-height:calc(100vh - 55px - 95px);
      overflow:hidden;
      background:black;
      touch-action:none;
    }

    #camera{
      width:100%;
      height:100%;
      min-height:inherit;
      object-fit:cover;
      display:block;
    }

    #captureBtn{
      position:absolute;
      bottom:84px;
      left:50%;
      transform:translateX(-50%);
      width:58px;
      height:58px;
      border-radius:50%;
      border:4px solid white;
      background:white;
      cursor:pointer;
      z-index:10000;
      box-shadow:0 0 20px rgba(255,255,255,.4), 0 0 12px rgba(0,0,0,.2);
      -webkit-tap-highlight-color:transparent;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #captureBtn:active{
      transform:translateX(-50%) scale(.96);
    }

    #captureBtn::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:2px solid rgba(0,0,0,.08);
    }

    .capture-icon{
      width:18px;
      height:18px;
      color:#222;
      opacity:.2;
      pointer-events:none;
    }

    .bottombar{
      position:fixed;
      left:12px;
      right:12px;
      bottom:var(--safe-bottom);
      height:65px;
      background:var(--bar);
      backdrop-filter:blur(15px);
      border:1px solid var(--bar-border);
      border-radius:24px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      z-index:9999;
      box-shadow:var(--shadow);
      padding:8px;
    }

    .nav-btn{
      flex:1;
      max-width:180px;
      height:48px;
      border:none;
      border-radius:18px;
      background:var(--btn);
      color:white;
      transition:transform .15s ease, opacity .15s ease, background .15s ease, color .15s ease;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }

    .nav-btn svg{
      width:22px;
      height:22px;
      color:currentColor;
    }

    .nav-btn:active{
      transform:scale(.96);
      opacity:.95;
    }

    .nav-btn.active{
      background:var(--btn-active);
      color:var(--btn-active-fg);
    }

    @media (max-width:380px){
      .bottombar{
        left:10px;
        right:10px;
        height:62px;
        gap:8px;
      }

      .nav-btn{
        height:46px;
      }

      #captureBtn{
        width:54px;
        height:54px;
        bottom:76px;
      }
    }

    @media (min-width:700px){
      .gallery{
        grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
      }

      .bottombar{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(560px, calc(100% - 24px));
      }

      #captureBtn{
        width:66px;
        height:66px;
      }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10010;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(100%, 520px);
      max-height:min(90vh, 780px);
      overflow:auto;
      background:rgba(247,189,214,.98);
      border-radius:24px;
      box-shadow:0 20px 45px rgba(0,0,0,.28);
      padding:14px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .modal-title{
      font-size:clamp(18px, 4vw, 24px);
      font-weight:800;
      color:#2b1a24;
    }

    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.75);
      cursor:pointer;
      font-size:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }

    .icon-btn svg{
      width:20px;
      height:20px;
      color:#2b1a24;
    }

    .modal-preview{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:18px;
      background:#fff;
      display:block;
    }

    .field{
      margin-top:12px;
    }

    .field label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
    }

    .field textarea{
      width:100%;
      min-height:96px;
      resize:vertical;
      border:none;
      outline:none;
      border-radius:14px;
      padding:12px;
      font-size:16px;
      background:rgba(255,255,255,.9);
    }

    .location-box{
      margin-top:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,.8);
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, opacity .15s ease, background .15s ease;
    }

    .location-box:active{
      transform:scale(.99);
    }

    .location-box.waiting{
      opacity:.75;
      pointer-events:none;
    }

    .location-box.disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .loc-title{
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
      display:flex;
      align-items:center;
      gap:8px;
    }

    #locationValue{
      font-size:14px;
      opacity:.85;
      color:#3f2433;
      word-break:break-word;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    .action-btn{
      flex:1;
      height:48px;
      border:none;
      border-radius:16px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .action-btn svg{
      width:18px;
      height:18px;
      color:currentColor;
    }

    .action-secondary{
      background:rgba(255,255,255,.72);
      color:#222;
    }

    .action-primary{
      background:#B299AD;
      color:white;
    }

    .action-danger{
      background:var(--danger);
      color:white;
    }

    .action-danger:hover{
      background:var(--danger-dark);
    }

    .hint{
      margin-top:8px;
      font-size:12px;
      color:#5c3a4d;
      opacity:.8;
      line-height:1.4;
    }

    #loader{
      position:fixed;
      inset:0;
      background:#F7BDD6;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999999;
      transition:opacity .35s ease, visibility .35s ease;
    }

    #loader.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-content{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    .loader-logo{
      width:92px;
      height:92px;
      animation:spin 1.1s linear infinite;
      display:block;
      color:white;
    }

    .loader-logo .ring{
      stroke-dasharray:220;
      stroke-dashoffset:120;
    }

    .loader-text{
      font-family:"Caveat",cursive;
      font-weight:800;
      font-size:28px;
      color:#2b1a24;
    }

    .loader-sub{
      font-size:13px;
      color:#5c3a4d;
      opacity:.8;
    }

    @keyframes spin{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    /* TOAST */

    #toast{
      position:fixed;
      left:50%;
      bottom:100px;
      transform:translateX(-50%);
      background:rgba(34,34,34,.96);
      color:white;
      padding:12px 16px;
      border-radius:14px;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease, transform .25s ease;
      z-index:100020;
      max-width:min(92vw, 420px);
      text-align:center;
      box-shadow:0 12px 30px rgba(0,0,0,.22);
      font-size:14px;
      line-height:1.35;
    }

    #toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media (min-width:700px){
      #toast{
        bottom:110px;
      }
    }

    /* CONFIRM MODAL */

    .confirm-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    .confirm-title{
      font-size:18px;
      font-weight:800;
      color:#2b1a24;
      margin-bottom:8px;
    }

    .confirm-text{
      color:#4b2d3d;
      line-height:1.45;
      font-size:14px;
    }
  </style>
</head>

<body>
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="loader-content">
      <svg class="loader-logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="8"></circle>
        <circle class="ring" cx="50" cy="50" r="34" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"></circle>
      </svg>
      <div class="loader-text">Pelus Takip</div>
      <div class="loader-sub">Hazırlanıyor...</div>
    </div>
  </div>

  <div id="connet">
    <div class="header">Pelus Takip</div>

    <div class="pages">
      <div id="galleryPage" class="gallery"></div>

      <div id="cameraPage" class="camera-page">
        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="captureBtn" aria-label="Fotoğraf çek">
          <svg class="capture-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="bottombar">
      <button class="nav-btn b1" type="button" aria-label="Galeri">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-13Zm2 1v11h12v-11H6Zm1 9 2.8-3.7a1 1 0 0 1 1.6 0L13 14l2.1-2.8a1 1 0 0 1 1.6 0L18 14.5V16H7v-.5Z"/>
        </svg>
      </button>
      <button class="nav-btn b2" type="button" aria-label="Kamera">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9 5.5a1.5 1.5 0 0 1 1.27-.7h3.46a1.5 1.5 0 0 1 1.27.7L16 7h2.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-8A2.5 2.5 0 0 1 5.5 7H8l1-1.5Zm3 4.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="photoModal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div id="modalTitle" class="modal-title">Fotoğraf</div>
        <button id="modalClose" class="icon-btn" type="button" aria-label="Kapat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.7 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.29 6.3-6.29 1.41 1.42Z"/>
          </svg>
        </button>
      </div>

      <img id="modalPreview" class="modal-preview" alt="Fotoğraf önizleme">

      <div class="field">
        <label for="noteInput">Not</label>
        <textarea id="noteInput" placeholder="Bu fotoğraf için not ekle..."></textarea>
      </div>

      <div id="locationBox" class="location-box" role="button" tabindex="0" aria-label="Konum">
        <div class="loc-title">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.2A2.2 2.2 0 1 1 12 6.8a2.2 2.2 0 0 1 0 4.4Z"/>
          </svg>
          <span id="locationTitleText">Konum</span>
        </div>
        <div id="locationValue">Henüz seçilmedi</div>
      </div>

      <div class="hint" id="locationHint">Yeni fotoğrafta konum eklemek için kutuya dokun. Kayıtlı fotoğrafta konum varsa harita açılır.</div>

      <div class="modal-actions">
        <button id="modalDelete" class="action-btn action-danger" type="button" style="display:none;">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M9 3.75A1.75 1.75 0 0 1 10.75 2h2.5A1.75 1.75 0 0 1 15 3.75V5h4a1 1 0 0 1 0 2h-1.06l-.7 11.1A2.25 2.25 0 0 1 15.99 20H8.01a2.25 2.25 0 0 1-2.25-1.9L5.06 7H4a1 1 0 1 1 0-2h4V3.75ZM10.75 4h2.5V5h-2.5V4ZM8.03 7l.68 10.81c.02.24.22.43.46.43h7.66c.24 0 .44-.19.46-.43L17.97 7H8.03Z"/>
          </svg>
          Sil
        </button>
        <button id="modalCancel" class="action-btn action-secondary" type="button">
          İptal
        </button>
        <button id="modalSave" class="action-btn action-primary" type="button">
          Kaydet
        </button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="confirm-title" id="confirmTitle">Fotoğraf silinsin mi?</div>
      <div class="confirm-text" id="confirmText">Bu işlem geri alınamaz.</div>

      <div class="confirm-actions">
        <button id="confirmCancel" class="action-btn action-secondary" type="button">Vazgeç</button>
        <button id="confirmOk" class="action-btn action-danger" type="button">Sil</button>
      </div>
    </div>
  </div>

  <div id="toast" aria-live="polite" aria-atomic="true"></div>

  <svg class="sr-only" aria-hidden="true" width="0" height="0" focusable="false">
    <symbol id="icon-gallery" viewBox="0 0 24 24">
      <path fill="currentColor" d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-13Zm2 1v11h12v-11H6Zm1 9 2.8-3.7a1 1 0 0 1 1.6 0L13 14l2.1-2.8a1 1 0 0 1 1.6 0L18 14.5V16H7v-.5Z"/>
    </symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path fill="currentColor" d="M9 5.5a1.5 1.5 0 0 1 1.27-.7h3.46a1.5 1.5 0 0 1 1.27.7L16 7h2.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-8A2.5 2.5 0 0 1 5.5 7H8l1-1.5Zm3 4.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.2A2.2 2.2 0 1 1 12 6.8a2.2 2.2 0 0 1 0 4.4Z"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.7 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.29 6.3-6.29 1.41 1.42Z"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path fill="currentColor" d="M9 3.75A1.75 1.75 0 0 1 10.75 2h2.5A1.75 1.75 0 0 1 15 3.75V5h4a1 1 0 0 1 0 2h-1.06l-.7 11.1A2.25 2.25 0 0 1 15.99 20H8.01a2.25 2.25 0 0 1-2.25-1.9L5.06 7H4a1 1 0 1 1 0-2h4V3.75ZM10.75 4h2.5V5h-2.5V4ZM8.03 7l.68 10.81c.02.24.22.43.46.43h7.66c.24 0 .44-.19.46-.43L17.97 7H8.03Z"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path fill="currentColor" d="M5 4.75A2.75 2.75 0 0 1 7.75 2h7.46a2.75 2.75 0 0 1 1.94.8l1.05 1.05c.52.52.8 1.22.8 1.94v11.46A2.75 2.75 0 0 1 16.25 20H7.75A2.75 2.75 0 0 1 5 17.25V4.75Zm3 1.25v3h8V7.04l-.87-.87A.75.75 0 0 0 14.6 6H8Zm0 12h8v-6H8v6Zm1-5h6v4H9v-4Z"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path fill="currentColor" d="m9.2 16.2-3.4-3.4 1.4-1.4 2 2 6.6-6.6 1.4 1.4-8 8Z"/>
    </symbol>
  </svg>

  <script>
    const galleryBtn = document.querySelector(".b1");
    const cameraBtn = document.querySelector(".b2");

    const galleryPage = document.getElementById("galleryPage");
    const cameraPage = document.getElementById("cameraPage");

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const captureBtn = document.getElementById("captureBtn");

    const photoModal = document.getElementById("photoModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalPreview = document.getElementById("modalPreview");
    const noteInput = document.getElementById("noteInput");
    const locationBox = document.getElementById("locationBox");
    const locationValue = document.getElementById("locationValue");
    const locationHint = document.getElementById("locationHint");
    const modalClose = document.getElementById("modalClose");
    const modalCancel = document.getElementById("modalCancel");
    const modalSave = document.getElementById("modalSave");
    const modalDelete = document.getElementById("modalDelete");
    const confirmModal = document.getElementById("confirmModal");
    const confirmCancel = document.getElementById("confirmCancel");
    const confirmOk = document.getElementById("confirmOk");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmText = document.getElementById("confirmText");
    const loader = document.getElementById("loader");
    const toast = document.getElementById("toast");

    const DB_NAME = "index.db";
    const STORE_NAME = "photos";
    const DB_VERSION = 2;
    const LOCAL_KEY = "pelus_photos_fallback";

    let stream = null;
    let db = null;
    let storageMode = "idb";

    let currentPhotoId = null;
    let currentPhotoImage = "";
    let currentPhotoCreated = null;
    let currentLocationLabel = "";
    let currentLocationMapsUrl = "";
    let currentPhotoSource = "gallery";
    let locationRequestToken = 0;
    let locationBusy = false;
    let confirmResolver = null;
    let toastTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function hideLoader() {
      if (!loader) return;
      loader.classList.add("hide");
      setTimeout(() => loader.remove(), 400);
    }

    function openDBWithTimeout(timeoutMs = 2500) {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB desteklenmiyor"));
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        let settled = false;

        const settleResolve = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };

        const settleReject = (error) => {
          if (settled) return;
          settled = true;
          reject(error);
        };

        const timer = setTimeout(() => {
          settleReject(new Error("IndexedDB zaman aşımı"));
        }, timeoutMs);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            const store = database.createObjectStore(STORE_NAME, {
              keyPath: "id",
              autoIncrement: true
            });
            store.createIndex("created", "created", { unique: false });
          }
        };

        request.onsuccess = (event) => {
          clearTimeout(timer);
          db = event.target.result;
          settleResolve(db);
        };

        request.onerror = () => {
          clearTimeout(timer);
          settleReject(request.error || new Error("IndexedDB açılamadı"));
        };

        request.onblocked = () => {
          clearTimeout(timer);
          settleReject(new Error("IndexedDB engellendi"));
        };
      });
    }

    function getLocalPhotos() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function setLocalPhotos(photos) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(photos));
    }

    function savePhoto(record) {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const request = record.id ? store.put(record) : store.add(record);

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      return new Promise((resolve) => {
        const photos = getLocalPhotos();

        if (record.id !== null && record.id !== undefined) {
          const index = photos.findIndex(p => p.id === record.id);
          if (index !== -1) {
            photos[index] = record;
          } else {
            photos.push(record);
          }
        } else {
          record.id = Date.now() + Math.random();
          photos.push(record);
        }

        setLocalPhotos(photos);
        resolve(record.id);
      });
    }

    function deletePhotoById(id) {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const request = store.delete(id);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      return new Promise((resolve) => {
        const photos = getLocalPhotos().filter(p => p.id !== id);
        setLocalPhotos(photos);
        resolve();
      });
    }

    function getAllPhotos() {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      return Promise.resolve(getLocalPhotos());
    }

    async function loadPhotos() {
      galleryPage.innerHTML = "";

      try {
        const photos = await getAllPhotos();
        const sorted = (photos || []).sort((a, b) => (b.created || 0) - (a.created || 0));

        if (sorted.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "Henüz fotoğraf yok";
          galleryPage.appendChild(empty);
          return;
        }

        sorted.forEach(photo => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card gallery-card";

          card.innerHTML = `
            <div class="cimg">
              <img src="${photo.image}" alt="kaydedilen fotoğraf">
            </div>
          `;

          card.addEventListener("click", () => {
            openEditModal(photo);
          });

          galleryPage.appendChild(card);
        });
      } catch {
        const errorBox = document.createElement("div");
        errorBox.className = "empty-state";
        errorBox.textContent = "Fotoğraflar yüklenemedi";
        galleryPage.appendChild(errorBox);
      }
    }

    async function initStorage() {
      try {
        await openDBWithTimeout();
        storageMode = "idb";
      } catch {
        db = null;
        storageMode = "local";
        showToast("Veritabanı yerine yerel kayıt kullanılıyor");
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        showToast("Kamera açılamadı");
      }
    }

    function stopCamera() {
      if (!stream) return;
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      stream = null;
    }

    function showGallery() {
      galleryPage.style.display = "grid";
      cameraPage.style.display = "none";
      stopCamera();
      setActiveNav("gallery");
    }

    function showCamera() {
      galleryPage.style.display = "none";
      cameraPage.style.display = "block";
      setActiveNav("camera");
    }

    function setActiveNav(which) {
      galleryBtn.classList.toggle("active", which === "gallery");
      cameraBtn.classList.toggle("active", which === "camera");
    }

    function openModal(el) {
      el.classList.add("show");
      el.setAttribute("aria-hidden", "false");
    }

    function closeModal(el) {
      el.classList.remove("show");
      el.setAttribute("aria-hidden", "true");
    }

    function closePhotoModal() {
      closeModal(photoModal);
      locationBusy = false;
      locationBox.classList.remove("waiting");
      if (currentPhotoSource === "capture") {
        showGallery();
      }
    }

    function setLocationLabel(label) {
      currentLocationLabel = label || "";
      locationValue.textContent = currentLocationLabel || "Henüz seçilmedi";
    }

    function setLocationMode(mode) {
      if (mode === "capture") {
        locationHint.textContent = "Konumu eklemek için kutuya dokun. Konum alınınca kayda yazılır.";
        locationBox.classList.remove("disabled");
      } else {
        locationHint.textContent = "Kayıtlı fotoğrafta konum varsa harita açılır. Konum yoksa açılmaz.";
      }
    }

    function buildGoogleMapsUrl(label) {
      const cleanLabel = (label || "").replace(/^Konum:\s*/i, "").trim();
      return cleanLabel ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanLabel)}` : "";
    }

    function hasValidSavedLocation(photo) {
      if (!photo) return false;
      const label = (photo.locationLabel || photo.location || "").trim();
      const url = (photo.mapsUrl || "").trim();
      return Boolean(url) || (label && !/^(Henüz seçilmedi|Konum: Seçilmedi|Konum: Alınamadı|Konum: Desteklenmiyor|Konum: Güvenli bağlantı yok)$/i.test(label));
    }

    function openEditModal(photo) {
      currentPhotoId = photo.id;
      currentPhotoImage = photo.image;
      currentPhotoCreated = photo.created || Date.now();
      currentPhotoSource = "gallery";
      modalTitle.textContent = "Fotoğraf Detayı";
      modalSave.textContent = "Güncelle";
      modalDelete.style.display = "inline-flex";
      noteInput.value = photo.note || "";
      modalPreview.src = photo.image;

      currentLocationLabel = (photo.locationLabel || photo.location || "").trim();
      currentLocationMapsUrl = (photo.mapsUrl || "").trim() || buildGoogleMapsUrl(currentLocationLabel);

      if (hasValidSavedLocation(photo)) {
        locationBox.classList.remove("disabled");
        locationValue.textContent = currentLocationLabel || "Konum bilgisi yok";
      } else {
        locationBox.classList.add("disabled");
        locationValue.textContent = "Konum kaydedilmemiş";
      }

      setLocationMode("gallery");
      openModal(photoModal);
    }

    function openNewModal(imageData) {
      currentPhotoId = null;
      currentPhotoImage = imageData;
      currentPhotoCreated = Date.now();
      currentPhotoSource = "capture";
      modalTitle.textContent = "Yeni Fotoğraf";
      modalSave.textContent = "Kaydet";
      modalDelete.style.display = "none";
      noteInput.value = "";
      modalPreview.src = imageData;
      currentLocationLabel = "";
      currentLocationMapsUrl = "";
      setLocationLabel("");
      setLocationMode("capture");
      openModal(photoModal);
    }

    function geoErrorText(err) {
      if (!err) return "Konum alınamadı";
      switch (err.code) {
        case 1: return "Konum izni reddedildi";
        case 2: return "Konum bilgisi bulunamadı";
        case 3: return "Konum isteği zaman aşımına uğradı";
        default: return "Konum alınamadı";
      }
    }

    function getPositionOnce(options) {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator)) {
          reject({ code: 0, message: "Tarayıcı konumu desteklemiyor" });
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position),
          (error) => reject(error),
          options
        );
      });
    }

    async function getCurrentLocation() {
      if (!window.isSecureContext && location.hostname !== "localhost") {
        return {
          label: "Konum: Güvenli bağlantı yok",
          mapsUrl: ""
        };
      }

      try {
        const first = await getPositionOnce({
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        });

        const lat = first.coords.latitude.toFixed(5);
        const lon = first.coords.longitude.toFixed(5);
        const acc = Math.round(first.coords.accuracy);

        return {
          label: `Konum: ${lat}, ${lon} (±${acc}m)`,
          mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`
        };
      } catch (err1) {
        try {
          const second = await getPositionOnce({
            enableHighAccuracy: false,
            timeout: 15000,
            maximumAge: 60000
          });

          const lat = second.coords.latitude.toFixed(5);
          const lon = second.coords.longitude.toFixed(5);
          const acc = Math.round(second.coords.accuracy);

          return {
            label: `Konum: ${lat}, ${lon} (±${acc}m)`,
            mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`
          };
        } catch (err2) {
          return {
            label: geoErrorText(err2 || err1),
            mapsUrl: ""
          };
        }
      }
    }

    async function handleLocationBoxClick() {
      if (currentPhotoSource === "gallery") {
        if (!currentLocationMapsUrl) {
          showToast("Kayıtlı konum yok");
          return;
        }
        window.open(currentLocationMapsUrl, "_blank", "noopener,noreferrer");
        return;
      }

      if (locationBusy) return;

      const token = ++locationRequestToken;
      locationBusy = true;
      locationBox.classList.add("waiting");
      locationValue.textContent = "Konum alınıyor...";

      const result = await getCurrentLocation();

      if (token !== locationRequestToken) return;

      locationBusy = false;
      locationBox.classList.remove("waiting");

      currentLocationLabel = result.label;
      currentLocationMapsUrl = result.mapsUrl || "";
      locationValue.textContent = currentLocationLabel;

      if (/^(Konum: Güvenli bağlantı yok|Konum: Alınamadı|Konum izni reddedildi|Konum bilgisi bulunamadı|Konum isteği zaman aşımına uğradı)$/i.test(currentLocationLabel)) {
        showToast(currentLocationLabel.replace(/^Konum:\s*/i, ""));
      }
    }

    async function saveCurrentModalPhoto() {
      if (!currentPhotoImage) return;

      const record = {
        image: currentPhotoImage,
        note: noteInput.value.trim(),
        locationLabel: currentLocationLabel || "Konum: Seçilmedi",
        mapsUrl: currentLocationMapsUrl || "",
        created: currentPhotoCreated || Date.now()
      };

      if (currentPhotoId !== null && currentPhotoId !== undefined) {
        record.id = currentPhotoId;
      }

      try {
        await savePhoto(record);
        await loadPhotos();
        showToast("Kaydedildi");
        closePhotoModal();
      } catch (err) {
        showToast("Fotoğraf kaydedilemedi");
      }
    }

    function openConfirmDelete() {
      confirmTitle.textContent = "Fotoğraf silinsin mi?";
      confirmText.textContent = "Bu işlem geri alınamaz.";
      openModal(confirmModal);
      return new Promise(resolve => {
        confirmResolver = resolve;
      });
    }

    async function deleteCurrentPhoto() {
      if (currentPhotoId === null || currentPhotoId === undefined) return;

      const approved = await openConfirmDelete();
      closeModal(confirmModal);

      if (!approved) return;

      try {
        await deletePhotoById(currentPhotoId);
        await loadPhotos();
        showToast("Fotoğraf silindi");
        closePhotoModal();
      } catch {
        showToast("Fotoğraf silinemedi");
      }
    }

    galleryBtn.addEventListener("click", async () => {
      showGallery();
      await loadPhotos();
    });

    cameraBtn.addEventListener("click", async () => {
      showCamera();
      if (!stream) {
        await startCamera();
      }
    });

    captureBtn.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const image = canvas.toDataURL("image/jpeg", 0.9);

      stopCamera();
      openNewModal(image);
    });

    locationBox.addEventListener("click", handleLocationBoxClick);
    locationBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleLocationBoxClick();
      }
    });

    modalClose.addEventListener("click", closePhotoModal);
    modalCancel.addEventListener("click", closePhotoModal);
    modalSave.addEventListener("click", saveCurrentModalPhoto);
    modalDelete.addEventListener("click", deleteCurrentPhoto);

    photoModal.addEventListener("click", (event) => {
      if (event.target === photoModal) closePhotoModal();
    });

    confirmCancel.addEventListener("click", () => {
      confirmResolver?.(false);
      confirmResolver = null;
      closeModal(confirmModal);
    });

    confirmOk.addEventListener("click", () => {
      confirmResolver?.(true);
      confirmResolver = null;
    });

    confirmModal.addEventListener("click", (event) => {
      if (event.target === confirmModal) {
        confirmResolver?.(false);
        confirmResolver = null;
        closeModal(confirmModal);
      }
    });

    window.addEventListener("beforeunload", stopCamera);

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await initStorage();
        await loadPhotos();
        setActiveNav("gallery");
      } catch {
        galleryPage.innerHTML = '<div class="empty-state">Yükleme başarısız oldu</div>';
      } finally {
        hideLoader();
      }
    });
  </script>
</body>
</html>
