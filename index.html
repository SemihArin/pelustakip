<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pelus Takip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F7BDD6;
      --bar:rgba(255,255,255,.38);
      --bar-border:rgba(255,255,255,.45);
      --btn:#B299AD;
      --btn-active:#ffffff;
      --btn-active-fg:#8f6f83;
      --text:#111;
      --shadow:0 8px 25px rgba(0,0,0,.15);
      --safe-bottom:max(12px, env(safe-area-inset-bottom));
      --safe-top:max(0px, env(safe-area-inset-top));
      --danger:#c95a6a;
      --danger-dark:#b44b5a;
      --gold:#e3b84a;
      --blue:#7aa6ff;
    }

    *{ box-sizing:border-box; }
    html,body{
      padding:0;
      margin:0;
      background:var(--bg);
      min-height:100vh;
      width:100%;
    }
    body{
      overflow-x:hidden;
      color:var(--text);
      font-family:system-ui, sans-serif;
    }
    button, textarea, input{ font:inherit; }
    svg{ display:block; }
    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    #connet{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      width:100%;
      min-height:45px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:black;
      border-bottom-left-radius:17px;
      border-bottom-right-radius:17px;
      font-size:29px;
      font-weight:900;
      font-family:"Caveat", cursive;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
      padding-top:var(--safe-top);
    }

    .page-header{
      position:sticky;
      top:0;
      z-index:100;
      padding:16px 18px 10px;
      backdrop-filter:blur(18px);
      background:rgba(247,189,214,.58);
    }

    .page-header h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      letter-spacing:-0.5px;
      color:#4d3140;
      line-height:1.1;
    }

    .pages{
      width:100%;
      flex:1;
      min-height:0;
      padding-bottom:calc(95px + var(--safe-bottom));
    }

    .page{ display:none; }
    .page.active{ display:block; }

    .gallery,
    .published-gallery{
      display:flex;
      flex-direction:column;
      gap:18px;
      padding:12px;
      width:100%;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .group-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 4px;
      color:#6a3d52;
      font-weight:800;
      font-size:15px;
    }

    .group-count{
      font-weight:700;
      opacity:.75;
      font-size:12px;
    }

    .group-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap:12px;
      width:100%;
    }

    .card{
      width:100%;
      aspect-ratio:1/1;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 5px 8px rgba(255,0,0,.25);
      background:#fff;
      position:relative;
    }

    .gallery-card,
    .published-card{
      padding:0;
      border:none;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      display:block;
      text-align:inherit;
    }

    .cimg{ width:100%; height:100%; }
    img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .fav-badge{
      position:absolute;
      top:8px;
      right:8px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
      pointer-events:none;
    }
    .fav-badge svg{
      width:15px;
      height:15px;
      color:var(--gold);
    }

    .published-badge{
      position:absolute;
      top:8px;
      left:8px;
      padding:6px 8px;
      border-radius:999px;
      background:rgba(122,166,255,.92);
      color:white;
      font-size:11px;
      font-weight:700;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
      pointer-events:none;
    }

    .published-meta{
      position:absolute;
      left:8px;
      right:8px;
      bottom:8px;
      padding:8px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.5));
      color:white;
      font-size:11px;
      text-shadow:0 1px 2px rgba(0,0,0,.35);
      pointer-events:none;
    }

    .empty-state{
      text-align:center;
      padding:24px 12px;
      color:#6a3d52;
      opacity:.8;
    }

    @media (max-width:400px){
      .group-grid{
        grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
        gap:10px;
      }
      .gallery,
      .published-gallery{
        padding:10px;
      }
    }

    .camera-page{
      display:none;
      position:relative;
      width:100%;
      min-height:calc(100vh - 55px - 95px);
      overflow:hidden;
      background:black;
      touch-action:none;
    }

    #camera{
      width:100%;
      height:100%;
      min-height:inherit;
      object-fit:cover;
      display:block;
      transition:transform .18s ease;
    }

    #camera.front-camera{ transform:scaleX(-1); }

    .camera-badge{
      position:absolute;
      top:16px;
      left:16px;
      z-index:10000;
      padding:9px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      font-size:13px;
      font-weight:700;
      color:#2b1a24;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
      pointer-events:none;
    }

    .focus-ring{
      position:absolute;
      width:74px;
      height:74px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.95);
      box-shadow:0 0 0 2px rgba(0,0,0,.14) inset;
      transform:translate(-50%,-50%) scale(.85);
      opacity:0;
      pointer-events:none;
      z-index:10001;
    }
    .focus-ring.show{ animation:focusPop .55s ease; }
    @keyframes focusPop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); }
      20%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
      100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05); }
    }

    .camera-controls{
      position:absolute;
      left:12px;
      right:12px;
      bottom:155px;
      z-index:10000;
      display:none;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(12px);
      box-shadow:0 10px 22px rgba(0,0,0,.14);
    }
    .camera-controls.show{ display:flex; }
    .camera-controls label{
      font-size:13px;
      font-weight:700;
      color:#2b1a24;
      white-space:nowrap;
    }
    .camera-controls input[type="range"]{ width:100%; }
    .camera-controls .value{
      min-width:42px;
      text-align:right;
      font-size:12px;
      font-weight:700;
      color:#2b1a24;
    }

    #captureBtn{
      position:absolute;
      bottom:84px;
      left:50%;
      transform:translateX(-50%);
      width:58px;
      height:58px;
      border-radius:50%;
      border:4px solid white;
      background:white;
      cursor:pointer;
      z-index:10000;
      box-shadow:0 0 20px rgba(255,255,255,.4), 0 0 12px rgba(0,0,0,.2);
      -webkit-tap-highlight-color:transparent;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #captureBtn:active{ transform:translateX(-50%) scale(.96); }
    #captureBtn::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:2px solid rgba(0,0,0,.08);
    }
    .capture-icon{
      width:18px;
      height:18px;
      color:#222;
      opacity:.2;
      pointer-events:none;
    }

    .camera-tool-btn{
      position:absolute;
      top:18px;
      right:18px;
      width:52px;
      height:52px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.85);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10000;
      padding:0;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
    }
    .camera-tool-btn svg{ width:24px; height:24px; color:#2b1a24; }
    .camera-tool-btn:active{ transform:scale(.96); }

    .bottombar{
      position:fixed;
      left:12px;
      right:12px;
      bottom:var(--safe-bottom);
      height:65px;
      background:var(--bar);
      backdrop-filter:blur(15px);
      border:1px solid var(--bar-border);
      border-radius:24px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      z-index:9999;
      box-shadow:var(--shadow);
      padding:8px;
    }
    .nav-btn{
      flex:1;
      max-width:180px;
      height:48px;
      border:none;
      border-radius:18px;
      background:var(--btn);
      color:white;
      transition:transform .15s ease, opacity .15s ease, background .15s ease, color .15s ease;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }
    .nav-btn svg{ width:22px; height:22px; color:currentColor; }
    .nav-btn:active{ transform:scale(.96); opacity:.95; }
    .nav-btn.active{ background:var(--btn-active); color:var(--btn-active-fg); }

    @media (max-width:380px){
      .bottombar{ left:10px; right:10px; height:62px; gap:8px; }
      .nav-btn{ height:46px; }
      #captureBtn{ width:54px; height:54px; bottom:76px; }
      .camera-tool-btn{ width:46px; height:46px; top:14px; right:14px; }
      .camera-tool-btn svg{ width:22px; height:22px; }
      .camera-badge{ top:12px; left:12px; font-size:12px; padding:8px 10px; }
      .camera-controls{ bottom:145px; left:10px; right:10px; padding:8px 10px; }
    }

    @media (min-width:700px){
      .group-grid{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
      .bottombar{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(560px, calc(100% - 24px));
      }
      #captureBtn{ width:66px; height:66px; }
      .camera-controls{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:min(560px, calc(100% - 24px));
      }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:10010;
    }
    .modal.show{ display:flex; }
    .modal-card{
      width:min(100%, 520px);
      max-height:min(90vh, 780px);
      overflow:auto;
      background:rgba(247,189,214,.98);
      border-radius:24px;
      box-shadow:0 20px 45px rgba(0,0,0,.28);
      padding:14px;
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .modal-title{
      font-size:clamp(18px, 4vw, 24px);
      font-weight:800;
      color:#2b1a24;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .modal-sub{ font-size:12px; font-weight:700; opacity:.75; }
    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.75);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }
    .icon-btn svg{ width:20px; height:20px; color:#2b1a24; }
    .modal-preview{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:18px;
      background:#fff;
      display:block;
    }
    .field{ margin-top:12px; }
    .field label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
    }
    .field textarea{
      width:100%;
      min-height:96px;
      resize:vertical;
      border:none;
      outline:none;
      border-radius:14px;
      padding:12px;
      font-size:16px;
      background:rgba(255,255,255,.9);
    }
    .switch-row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .switch-chip{
      padding:10px 12px;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:rgba(255,255,255,.76);
      color:#2b1a24;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .switch-chip.active{ background:#B299AD; color:white; }
    .location-box{
      margin-top:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,.8);
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, opacity .15s ease, background .15s ease;
    }
    .location-box:active{ transform:scale(.99); }
    .location-box.waiting{ opacity:.75; pointer-events:none; }
    .location-box.disabled{ opacity:.55; cursor:not-allowed; }
    .loc-title{
      font-weight:700;
      margin-bottom:6px;
      color:#2b1a24;
      display:flex;
      align-items:center;
      gap:8px;
    }
    #locationValue{
      font-size:14px;
      opacity:.85;
      color:#3f2433;
      word-break:break-word;
    }
    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:14px;
    }
    .action-full{ grid-column:1 / -1; }
    .action-btn{
      height:48px;
      border:none;
      border-radius:16px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 12px;
    }
    .action-btn svg{ width:18px; height:18px; color:currentColor; }
    .action-secondary{ background:rgba(255,255,255,.72); color:#222; }
    .action-primary{ background:#B299AD; color:white; }
    .action-danger{ background:var(--danger); color:white; }
    .action-danger:hover{ background:var(--danger-dark); }
    .hint{
      margin-top:8px;
      font-size:12px;
      color:#5c3a4d;
      opacity:.8;
      line-height:1.4;
    }

    #loader{
      position:fixed;
      inset:0;
      background:#F7BDD6;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999999;
      transition:opacity .35s ease, visibility .35s ease;
    }
    #loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
    .loader-content{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .loader-logo{
      width:92px;
      height:92px;
      animation:spin 1.1s linear infinite;
      display:block;
      color:white;
    }
    .loader-logo .ring{ stroke-dasharray:220; stroke-dashoffset:120; }
    .loader-text{
      font-family:"Caveat",cursive;
      font-weight:800;
      font-size:28px;
      color:#2b1a24;
    }
    .loader-sub{ font-size:13px; color:#5c3a4d; opacity:.8; }
    @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

    #toast{
      position:fixed;
      left:50%;
      bottom:100px;
      transform:translateX(-50%);
      background:rgba(34,34,34,.96);
      color:white;
      padding:12px 16px;
      border-radius:14px;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease, transform .25s ease;
      z-index:100020;
      max-width:min(92vw, 420px);
      text-align:center;
      box-shadow:0 12px 30px rgba(0,0,0,.22);
      font-size:14px;
      line-height:1.35;
    }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    @media (min-width:700px){ #toast{ bottom:110px; } }

    .confirm-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
    }
    .confirm-title{
      font-size:18px;
      font-weight:800;
      color:#2b1a24;
      margin-bottom:8px;
    }
    .confirm-text{
      color:#4b2d3d;
      line-height:1.45;
      font-size:14px;
    }

    .section-switch{
      display:flex;
      gap:10px;
      padding:10px 12px 0 12px;
    }
    .section-switch button{
      flex:1;
      border:none;
      border-radius:14px;
      padding:10px 12px;
      background:rgba(255,255,255,.6);
      font-weight:800;
      color:#2b1a24;
    }
    .section-switch button.active{
      background:#ffffff;
      color:#7b5c6d;
    }

    .publish-card-info{
      position:absolute;
      left:8px;
      right:8px;
      bottom:8px;
      padding:10px;
      border-radius:12px;
      background:rgba(0,0,0,.35);
      color:#fff;
      font-size:11px;
      line-height:1.35;
      pointer-events:none;
    }

    .small-muted{
      opacity:.75;
      font-size:11px;
      margin-top:4px;
      display:block;
    }
  </style>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#F7BDD6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pelus Takip">
  <link rel="apple-touch-icon" href="./pelus-assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./pelus-assets/pelus-icon-192.png">
</head>

<body>
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="loader-content">
      <svg class="loader-logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="8"></circle>
        <circle class="ring" cx="50" cy="50" r="34" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"></circle>
      </svg>
      <div class="loader-text">Pelus Takip</div>
      <div class="loader-sub">Hazırlanıyor...</div>
    </div>
  </div>
    <div id="connet">
    <div class="header">Pelus Takip</div>

    <div class="pages">
      <div id="localPage" class="page active">
        <div id="galleryPage" class="gallery"></div>
      </div>

      <div id="publishedPage" class="page">
        <div id="publishedGallery" class="published-gallery"></div>
      </div>

      <div id="cameraPage" class="camera-page page">
        <div id="cameraBadge" class="camera-badge">Arka Kamera</div>
        <div id="focusRing" class="focus-ring"></div>

        <video id="camera" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <button id="switchCameraBtn" class="camera-tool-btn" type="button" aria-label="Kamerayı değiştir">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M7 7h4l1.2-2h-.4A2 2 0 0 0 10 6H7a3 3 0 0 0-3 3v2h2V9a1 1 0 0 1 1-1Zm10 8h-4l-1.2 2h.4a2 2 0 0 0 1.8-1H17a3 3 0 0 0 3-3v-2h-2v2a1 1 0 0 1-1 1Zm-3.5-7L17 12l-3.5 4v-3H10v-2h3.5V8Zm-3 8L7 12l3.5-4v3H14v2h-3.5v3Z"/>
          </svg>
        </button>

        <div id="cameraControls" class="camera-controls">
          <label for="zoomRange">Yakınlaştırma</label>
          <input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1">
          <div id="zoomValue" class="value">1.0x</div>
        </div>

        <button id="captureBtn" aria-label="Fotoğraf çek">
          <svg class="capture-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="bottombar">
      <button id="navLocalBtn" class="nav-btn active" type="button" aria-label="Galeri">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-13Zm2 1v11h12v-11H6Zm1 9 2.8-3.7a1 1 0 0 1 1.6 0L13 14l2.1-2.8a1 1 0 0 1 1.6 0L18 14.5V16H7v-.5Z"/>
        </svg>

    function openDBWithTimeout(timeoutMs = 2500) {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB desteklenmiyor"));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        let settled = false;

        const settleResolve = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };
        const settleReject = (error) => {
          if (settled) return;
          settled = true;
          reject(error);
        };
        const timer = setTimeout(() => settleReject(new Error("IndexedDB zaman aşımı")), timeoutMs);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            const store = database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
            store.createIndex("created", "created", { unique: false });
          }
        };

        request.onsuccess = (event) => {
          clearTimeout(timer);
          db = event.target.result;
          settleResolve(db);
        };
        request.onerror = () => { clearTimeout(timer); settleReject(request.error || new Error("IndexedDB açılamadı")); };
        request.onblocked = () => { clearTimeout(timer); settleReject(new Error("IndexedDB engellendi")); };
      });
    }

    function savePhoto(record) {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const request = record.id ? store.put(record) : store.add(record);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      return new Promise((resolve) => {
        const photos = getLocalPhotos();
        if (record.id !== null && record.id !== undefined) {
          const index = photos.findIndex(p => p.id === record.id);
          if (index !== -1) photos[index] = record;
          else photos.push(record);
        } else {
          record.id = Date.now() + Math.random();
          photos.push(record);
        }
        setLocalPhotos(photos);
        resolve(record.id);
      });
    }

    function deletePhotoById(id) {

          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }
      return new Promise((resolve) => {
        const photos = getLocalPhotos().filter(p => p.id !== id);
        setLocalPhotos(photos);
        resolve();
      });
    }

    function getAllPhotos() {
      if (storageMode === "idb" && db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }
      return Promise.resolve(getLocalPhotos());
    }

    function formatDateKey(ts){
      const d = new Date(ts);
      return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
    }

    function formatGroupLabel(key){
      const [y,m,d] = key.split("-").map(Number);
      const date = new Date(y, m-1, d);
      const today = new Date();
      const todayKey = formatDateKey(today.getTime());
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const yesterdayKey = formatDateKey(yesterday.getTime());
      if (key === todayKey) return "Bugün";
      if (key === yesterdayKey) return "Dün";
      return date.toLocaleDateString("tr-TR", { day:"2-digit", month:"long", year:"numeric" });
    }

    function groupPhotosByDate(photos){
      const groups = new Map();
      photos.forEach(photo => {
        const key = formatDateKey(photo.created || Date.now());
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(photo);
      });
      return [...groups.entries()].sort((a,b) => b[0].localeCompare(a[0])).map(([key, items]) => ({ key, label: formatGroupLabel(key), items }));
    }

    async function stopCameraFully() {
      if (cameraTrack) {
        try { cameraTrack.onended = null; } catch {}
        try { cameraTrack.stop(); } catch {}
        cameraTrack = null;
      }
      if (!stream) {
        video.srcObject = null;
        return;
      }
      const tracks = stream.getTracks();
      const endedPromises = tracks.map(track => new Promise(resolve => {
        if (track.readyState === "ended") { resolve(); return; }
        track.onended = () => resolve();
      }));
      tracks.forEach(track => { try { track.stop(); } catch {} });
      try { video.pause(); } catch {}
      video.srcObject = null;
      await Promise.race([Promise.allSettled(endedPromises), sleep(900)]);
      stream = null;
    }

    function resetCameraControls(){
      canZoom = false;
      zoomRange.min = 1;
      zoomRange.max = 1;
      zoomRange.step = 0.1;
      zoomRange.value = 1;
      zoomValue.textContent = "1.0x";
      cameraControls.classList.remove("show");
    }

    async function applyZoom(value){
      if (!cameraTrack) return;
      const zoom = Math.max(currentZoomMin, Math.min(currentZoomMax, Number(value || 1)));
      currentZoom = zoom;
      zoomValue.textContent = `${zoom.toFixed(1)}x`;
      zoomRange.value = String(zoom);
      try {
        await cameraTrack.applyConstraints({ advanced:[{ zoom }] });
      } catch {}
    }

    function setupCameraCapabilities(){
      resetCameraControls();
      if (!cameraTrack || !cameraTrack.getCapabilities) return;
      const caps = cameraTrack.getCapabilities();
      if (caps && typeof caps.zoom === "number") {
        canZoom = true;
        currentZoomMin = caps.zoom.min ?? 1;
        currentZoomMax = caps.zoom.max ?? 1;
        currentZoomStep = caps.zoom.step ?? 0.1;
        currentZoom = Math.max(currentZoomMin, Math.min(currentZoomMax, currentZoom || 1));
        zoomRange.min = String(currentZoomMin);
        zoomRange.max = String(currentZoomMax);
        zoomRange.step = String(currentZoomStep);
        zoomRange.value = String(currentZoom);
        zoomValue.textContent = `${currentZoom.toFixed(1)}x`;
        cameraControls.classList.add("show");
      }
      try {
        if (caps && caps.focusMode && Array.isArray(caps.focusMode)) {
          cameraTrack.applyConstraints({ advanced:[{ focusMode:"continuous" }] }).catch(()=>{});
        }
      } catch {}
    }

    async function openCamera(mode) {
      if (cameraBusy) return false;
      cameraBusy = true;
      try {
        await stopCameraFully();
        await sleep(700);
        const attempts = [
          { video: { facingMode: { exact: mode } }, audio: false },
          { video: { facingMode: { ideal: mode } }, audio: false },
          { video: { facingMode: mode }, audio: false },
          { video: true, audio: false }
        ];
        for (const constraints of attempts) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            try { await video.play(); } catch {}
            cameraTrack = stream.getVideoTracks()[0] || null;
            currentFacingMode = mode;
            setCameraBadge(mode);
            setupCameraCapabilities();
            return true;
          } catch {}
        }
        showToast("Kamera açılamadı");
        return false;
      } finally {
        cameraBusy = false;
      }
    }

      const label = (photo.locationLabel || photo.location || "").trim();
      const url = (photo.mapsUrl || "").trim();
      return Boolean(url) || (label && !/^(Henüz seçilmedi|Konum: Seçilmedi|Konum: Alınamadı|Konum: Desteklenmiyor|Konum: Güvenli bağlantı yok|Konum izni reddedildi|Konum bilgisi bulunamadı|Konum isteği zaman aşımına uğradı)$/i.test(label));
    }

    function updateFavoriteUI(isFav){
      favoriteBtn.classList.toggle("active", !!isFav);
      favIconPath.setAttribute("d", "M12 17.3 6.2 20.9l1.6-6.6L2.7 9.8l6.8-.6L12 2.9l2.5 6.3 6.8.6-5.1 4.5 1.6 6.6L12 17.3Z");
    }

    function formatDateTime(ts){
      return new Date(ts || Date.now()).toLocaleString("tr-TR");
    }

    function openEditModal(photo) {
      currentPhotoId = photo.id;
      currentPhotoImage = photo.image;
      currentPhotoCreated = photo.created || Date.now();
      currentPhotoSource = "gallery";
      currentPhotoFavorite = !!photo.favorite;
      currentPhotoPublishedId = photo.publishedId || null;

      modalTitle.textContent = photo.published ? "Yayın Detayı" : "Fotoğraf Detayı";
      modalSub.textContent = formatDateTime(currentPhotoCreated);
      modalSave.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4.75A2.75 2.75 0 0 1 7.75 2h7.46a2.75 2.75 0 0 1 1.94.8l1.05 1.05c.52.52.8 1.22.8 1.94v11.46A2.75 2.75 0 0 1 16.25 20H7.75A2.75 2.75 0 0 1 5 17.25V4.75Zm3 1.25v3h8V7.04l-.87-.87A.75.75 0 0 0 14.6 6H8Zm0 12h8v-6H8v6Zm1-5h6v4H9v-4Z"/></svg>Güncelle';
      modalDelete.style.display = "inline-flex";
      noteInput.value = photo.note || "";
      modalPreview.src = photo.image;
      updateFavoriteUI(currentPhotoFavorite);

      currentLocationLabel = (photo.locationLabel || photo.location || "").trim();
      currentLocationMapsUrl = (photo.mapsUrl || "").trim() || buildGoogleMapsUrl(currentLocationLabel);

      if (hasValidSavedLocation(photo)) {
        locationBox.classList.remove("disabled");
        locationValue.textContent = currentLocationLabel || "Konum bilgisi yok";
      } else {
        locationBox.classList.add("disabled");
        locationValue.textContent = "Konum kaydedilmemiş";
      }

      setLocationMode("gallery");
      openModal(photoModal);
    }

    function openNewModal(imageData) {
      currentPhotoId = null;
      currentPhotoImage = imageData;
      currentPhotoCreated = Date.now();
      currentPhotoSource = "capture";
      currentPhotoFavorite = false;
      currentPhotoPublishedId = null;
      modalTitle.textContent = "Yeni Fotoğraf";
      modalSub.textContent = "";
      modalSave.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4.75A2.75 2.75 0 0 1 7.75 2h7.46a2.75 2.75 0 0 1 1.94.8l1.05 1.05c.52.52.8 1.22.8 1.94v11.46A2.75 2.75 0 0 1 16.25 20H7.75A2.75 2.75 0 0 1 5 17.25V4.75Zm3 1.25v3h8V7.04l-.87-.87A.75.75 0 0 0 14.6 6H8Zm0 12h8v-6H8v6Zm1-5h6v4H9v-4Z"/></svg>Kaydet';
      modalDelete.style.display = "none";
      noteInput.value = "";
      modalPreview.src = imageData;
      currentLocationLabel = "";
      currentLocationMapsUrl = "";
      updateFavoriteUI(false);
      setLocationLabel("");
      setLocationMode("capture");
      openModal(photoModal);
    }

    function geoErrorText(err) {
      if (!err) return "Konum alınamadı";
      switch (err.code) {
        case 1: return "Konum izni reddedildi";
        case 2: return "Konum bilgisi bulunamadı";
        case 3: return "Konum isteği zaman aşımına uğradı";
        default: return "Konum alınamadı";
      }
    }

    function getPositionOnce(options) {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator)) {
          reject({ code: 0, message: "Tarayıcı konumu desteklemiyor" });
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    async function getCurrentLocation() {
      try {
        if (navigator.permissions) {
          try {
            const permission = await navigator.permissions.query({ name: "geolocation" });
            if (permission.state === "denied") return { label: "Konum izni kapalı", mapsUrl: "" };
          } catch {}
        }
        const first = await getPositionOnce({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
        const lat = first.coords.latitude.toFixed(6);
        const lon = first.coords.longitude.toFixed(6);
        const acc = Math.round(first.coords.accuracy);
        return { label: `Konum: ${lat}, ${lon} (±${acc}m)`, mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}` };
      } catch (err1) {
        try {
          const second = await getPositionOnce({ enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
          const lat = second.coords.latitude.toFixed(6);
          const lon = second.coords.longitude.toFixed(6);
          const acc = Math.round(second.coords.accuracy);
          return { label: `Konum: ${lat}, ${lon} (±${acc}m)`, mapsUrl: `https://www.google.com/maps/search/?api=1&query=${lat},${lon}` };
        } catch (err2) {
          return { label: geoErrorText(err2 || err1), mapsUrl: "" };
        }
      }
    }

    async function handleLocationBoxClick() {
      if (currentPhotoSource === "gallery") {
        if (!currentLocationMapsUrl) {
          showToast("Kayıtlı konum yok");
          return;
        }
        window.open(currentLocationMapsUrl, "_blank", "noopener,noreferrer");
        return;
      }
      if (locationBusy) return;
      const token = ++locationRequestToken;
      locationBusy = true;
      locationBox.classList.add("waiting");
      locationValue.textContent = "Konum alınıyor...";
      const result = await getCurrentLocation();
      if (token !== locationRequestToken) return;
      locationBusy = false;
      locationBox.classList.remove("waiting");
      currentLocationLabel = result.label;
      currentLocationMapsUrl = result.mapsUrl || "";
      locationValue.textContent = currentLocationLabel;
      if (/^(Konum izni kapalı|Konum izni reddedildi|Konum bilgisi bulunamadı|Konum isteği zaman aşımına uğradı|Konum alınamadı)$/i.test(currentLocationLabel)) {
        showToast(currentLocationLabel);
      }
    }

    async function saveCurrentModalPhoto() {
      if (!currentPhotoImage) return;
      const record = {
        image: currentPhotoImage,
        note: noteInput.value.trim(),
        locationLabel: currentLocationLabel || "Konum: Seçilmedi",
        mapsUrl: currentLocationMapsUrl || "",
        favorite: !!currentPhotoFavorite,
        published: false,
        publishedId: currentPhotoPublishedId || null,
        created: currentPhotoCreated || Date.now()
      };
      if (currentPhotoId !== null && currentPhotoId !== undefined) record.id = currentPhotoId;
      try {
        await savePhoto(record);
        await loadPhotos();
        showToast("Kaydedildi");
        closePhotoModal();
      } catch {
        showToast("Fotoğraf kaydedilemedi");
      }
    }

    async function shareCurrentPhoto() {
      if (!currentPhotoImage) {
        showToast("Paylaşılacak fotoğraf yok");
        return;
      }
      try {
        if (!navigator.share) {
          showToast("Bu cihaz paylaşımı desteklemiyor");
          return;
        }
        const response = await fetch(currentPhotoImage);
        const blob = await response.blob();
        const file = new File([blob], `pelus-${Date.now()}.jpg`, { type: blob.type || "image/jpeg" });
        const textParts = [];
        const note = noteInput.value.trim();
        if (note) textParts.push(note);
        if (currentLocationLabel && !/^(Henüz seçilmedi|Konum: Seçilmedi)$/i.test(currentLocationLabel)) textParts.push(currentLocationLabel);
        const shareData = { title: "Pelus Takip", text: textParts.join("\n\n") };
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          shareData.files = [file];
        } else {
          showToast("Bu cihaz dosya paylaşımını desteklemiyor");
          return;
        }
        await navigator.share(shareData);
        showToast("Paylaşıldı");
      } catch (err) {
        if (err && err.name === "AbortError") return;
        showToast("Paylaşım başarısız");
      }
    }

    async function publishCurrentPhoto() {
      if (!currentPhotoImage) {
        showToast("Fotoğraf yok");
        return;
      }
      try {
        showToast("Yayınlanıyor...");
        const response = await fetch(currentPhotoImage);
        const blob = await response.blob();
        const fileName = `pelus-${Date.now()}.jpg`;
        const fileRef = storageRef(storageFirebase, `published/${fileName}`);
        await uploadBytes(fileRef, blob, { contentType: blob.type || "image/jpeg" });
        const imageUrl = await getDownloadURL(fileRef);
        const payload = {
          image: imageUrl,
          note: noteInput.value.trim(),
          locationLabel: currentLocationLabel || "",
          mapsUrl: currentLocationMapsUrl || "",
          favorite: !!currentPhotoFavorite,
          originalLocalId: currentPhotoId || null,
          source: "pelus-takip",
          created: serverTimestamp(),
          createdAtClient: Date.now()
        };
        if (currentPhotoPublishedId) {
          await updateDoc(doc(dbFirebase, firebaseCollectionName, currentPhotoPublishedId), payload);
          showToast("Yayın güncellendi");
        } else {
          const docRef = await addDoc(collection(dbFirebase, firebaseCollectionName), payload);
          currentPhotoPublishedId = docRef.id;
          if (currentPhotoId !== null && currentPhotoId !== undefined) {
            await savePhoto({
              id: currentPhotoId,
              image: currentPhotoImage,
              note: noteInput.value.trim(),
              locationLabel: currentLocationLabel || "Konum: Seçilmedi",
              mapsUrl: currentLocationMapsUrl || "",
              favorite: !!currentPhotoFavorite,
              published: true,
              publishedId: docRef.id,
              created: currentPhotoCreated || Date.now()
            });
          }
          showToast("Yayınlandı");
        }
        await loadPhotos();
        await loadPublishedPhotos();
      } catch (err) {
        console.error(err);
        showToast("Yayınlama başarısız");
      }
    }

    function openConfirmDelete() {
      confirmTitle.textContent = "Fotoğraf silinsin mi?";
      confirmText.textContent = "Bu işlem geri alınamaz.";
      openModal(confirmModal);
      return new Promise(resolve => { confirmResolver = resolve; });
    }

    async function deleteCurrentPhoto() {
      if (currentPhotoId === null || currentPhotoId === undefined) return;
      const approved = await openConfirmDelete();
      closeModal(confirmModal);
      if (!approved) return;
      try {
        if (currentPhotoPublishedId) {
          try { await deleteDoc(doc(dbFirebase, firebaseCollectionName, currentPhotoPublishedId)); } catch {}
        }
        await deletePhotoById(currentPhotoId);
        await loadPhotos();
        await loadPublishedPhotos();
        showToast("Fotoğraf silindi");
        closePhotoModal();
      } catch {
        showToast("Fotoğraf silinemedi");
      }
    }

    function focusAtPoint(event){
      if (!video) return;
      const rect = video.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      focusRing.style.left = `${x}%`;
      focusRing.style.top = `${y}%`;
      focusRing.classList.remove("show");
      void focusRing.offsetWidth;
      focusRing.classList.add("show");
      if (cameraTrack && cameraTrack.getCapabilities) {
        const caps = cameraTrack.getCapabilities();
        try {
          if (caps.focusMode) cameraTrack.applyConstraints({ advanced:[{ focusMode:"continuous" }] }).catch(()=>{});
        } catch {}
      }
    }
    video.addEventListener("pointerdown", focusAtPoint);

    function formatPublishedItem(item) {
      const ts = item.createdAtClient || Date.now();
      return {
        id: item.id,
        image: item.image,
        note: item.note || "",
        locationLabel: item.locationLabel || "",
        mapsUrl: item.mapsUrl || "",
        favorite: !!item.favorite,
        published: true,
        created: ts,
        createdLabel: item.created?.toDate ? item.created.toDate().toLocaleString("tr-TR") : formatDateTime(ts)
      };
    }

    function renderPublishedPhotos(items) {
      publishedGallery.innerHTML = "";
      const sorted = [...items].sort((a,b) => (b.createdAtClient || 0) - (a.createdAtClient || 0));
      if (!sorted.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Henüz yayın yok";
        publishedGallery.appendChild(empty);
        return;
      }
      sorted.forEach(item => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card published-card";
        card.innerHTML = `
          <div class="cimg">
            <img src="${item.image}" alt="yayınlanan fotoğraf">
            <div class="published-badge">Yayın</div>
            <div class="published-meta">
              <div>${item.note ? item.note : "Not yok"}</div>
              <span class="small-muted">${item.locationLabel || "Konum yok"}</span>
            </div>
          </div>
        `;
        card.addEventListener("click", () => openEditModal(item));
        publishedGallery.appendChild(card);
      });
    }

    async function loadPublishedPhotos() {
      if (publishedUnsubscribe) return;
      const q = query(collection(dbFirebase, firebaseCollectionName), orderBy("createdAtClient", "desc"));
      publishedUnsubscribe = onSnapshot(q, (snap) => {
        const items = snap.docs.map(d => formatPublishedItem({ id: d.id, ...d.data() }));
        publishedPhotosCache = items;
        renderPublishedPhotos(items);
      }, (err) => {
        console.error(err);
        publishedGallery.innerHTML = '<div class="empty-state">Yayınlar yüklenemedi</div>';
      });
    }

    navLocalBtn.addEventListener("click", async () => {
      showLocalPage();
      await loadPhotos();
    });    navPublishedBtn.addEventListener("click", async () => {
      showPublishedPage();
      if (!publishedUnsubscribe) await loadPublishedPhotos();
    });    navCameraBtn.addEventListener("click", async () => {
      showCamera();
      await startDefaultCamera();
    });

    captureBtn.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      if (currentFacingMode === "user") {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      const image = canvas.toDataURL("image/jpeg", 0.92);
      stopCameraFully();
      openNewModal(image);
    });

    switchCameraBtn.addEventListener("click", async () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      const ok = await openCamera(currentFacingMode);
      if (ok) showToast(currentFacingMode === "user" ? "Ön kamera açıldı" : "Arka kamera açıldı");
    });

    zoomRange.addEventListener("input", (e) => applyZoom(e.target.value));
    favoriteBtn.addEventListener("click", () => {
      currentPhotoFavorite = !currentPhotoFavorite;
      updateFavoriteUI(currentPhotoFavorite);
      showToast(currentPhotoFavorite ? "Favorilere eklendi" : "Favorilerden çıkarıldı");
    });

    locationBox.addEventListener("click", handleLocationBoxClick);
    locationBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleLocationBoxClick();
      }
    });

    modalClose.addEventListener("click", closePhotoModal);
    modalCancel.addEventListener("click", closePhotoModal);
    modalSave.addEventListener("click", saveCurrentModalPhoto);
    modalShare.addEventListener("click", shareCurrentPhoto);
    publishBtn.addEventListener("click", publishCurrentPhoto);
    modalDelete.addEventListener("click", deleteCurrentPhoto);
    photoModal.addEventListener("click", (event) => {
      if (event.target === photoModal) closePhotoModal();
    });

    confirmCancel.addEventListener("click", () => {
      confirmResolver?.(false);
      confirmResolver = null;
      closeModal(confirmModal);
    });
    confirmOk.addEventListener("click", () => {
      confirmResolver?.(true);
      confirmResolver = null;
    });
    confirmModal.addEventListener("click", (event) => {
      if (event.target === confirmModal) {
        confirmResolver?.(false);
        confirmResolver = null;
        closeModal(confirmModal);
      }
    });

    window.addEventListener("beforeunload", async () => {
      await stopCameraFully();
      if (publishedUnsubscribe) {
        try { publishedUnsubscribe(); } catch {}
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await initStorage();
        await loadPhotos();
        await loadPublishedPhotos();
        setActiveNav("local");
        setCameraBadge("environment");
      } catch (err) {
        console.error(err);
        galleryPage.innerHTML = '<div class="empty-state">Yükleme başarısız oldu</div>';
      } finally {
        hideLoader();
      }
    });
  </script>
</body>
</html>
